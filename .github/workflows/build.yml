name: Build shelter page

on:
  schedule:
    # Twice a day, ~20 requests to book.naturstyrelsen.dk per run.
    # 05:37 / 17:37 UTC is about 07:37 / 19:37 in Copenhagen in summer,
    # an hour earlier in winter. Deliberately off the hour: GitHub delays
    # runs scheduled at :00 the most, because everyone picks :00.
    - cron: "37 5,17 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Re-scan the site list (slower, ~40 requests) and commit the refreshed cache"
        type: boolean
        default: false

# Default for every job: read-only. The build job widens this to contents:
# write for the cache commit-back; deploy inherits the Pages scopes here.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A queued run replaces an older queued one, but a
# publish already in flight is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the top-level block rather than merging,
    # so this job gets contents:write and nothing else. It never touches Pages.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Standard library only, so this installs nothing -- it just pins the
      # interpreter so builds don't drift when GitHub changes the runner
      # image. Safe to delete; the runner's own python3 works fine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only on a manual run with the box ticked. shelters.py re-discovers
      # whenever the cache is missing, so deleting it is the whole trigger.
      #
      # inputs.rediscover is a real boolean because the input is declared
      # type: boolean. Do NOT switch this to github.event.inputs.rediscover,
      # which is the *string* "false" on an unticked run -- and a non-empty
      # string is truthy, so it would re-discover on every manual run.
      - name: Drop cached site list
        if: ${{ inputs.rediscover == true }}
        run: rm -f amager-places.json

      - name: Build site/index.html
        shell: bash
        run: |
          set -o pipefail
          python3 shelters.py site 2>&1 | tee build.log

      # ---- optional guard, delete this step if you don't want it ----------
      # shelters.py logs a failed fetch and carries on, so if the endpoint
      # blocks or moves, the build still exits 0 and publishes a page showing
      # every night as free. This fails the run only when *every* probe
      # failed (2 per site), which is never a legitimate result.
      - name: Fail if every fetch failed
        shell: bash
        run: |
          sites=$(sed -n 's/^\([0-9][0-9]*\) bookable daily sites.*/\1/p' build.log)
          fails=$(grep -c "fetch failed" build.log || true)
          if [ -n "$sites" ] && [ "$fails" -ge "$((sites * 2))" ]; then
            echo "::error::all $fails booking requests failed - refusing to publish an all-free page"
            exit 1
          fi
      # ---- end optional guard ---------------------------------------------

      # Runs after the guard, so a broken scrape can never commit a bad cache.
      # [skip ci] stops this push from triggering another full build.
      - name: Commit refreshed site list
        if: ${{ inputs.rediscover == true }}
        shell: bash
        run: |
          if git diff --quiet -- amager-places.json; then
            echo "site list unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amager-places.json
          git commit -m "Refresh cached shelter site list [skip ci]"
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
